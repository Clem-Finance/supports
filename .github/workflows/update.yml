name: Mise à jour des données
on:
  schedule:
    - cron: "30 6 * * 1-5"   # chaque jour ouvré à 06h30 UTC
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
  push:
    paths: ["isin.txt", "manuel.json"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python update.py
      - name: Enregistrer les données
        run: |
          git config user.name "maj-auto"
          git config user.email "maj-auto@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Mise à jour des données" && git push)
